[project]
name = "milisten"
version = "0.1.0"
description = "Turn articles, papers and regulatory PDFs into natural-sounding audiobooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
milisten = "milisten.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milisten"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["test"]
